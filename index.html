<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba Peta Mutlak</title>
    
    <!-- MENGGUNAKAN CDN JSDELIVR (Jauh lebih ramah untuk browser lokal) + ATRIBUT CROSSORIGIN MANDATORI -->
    <link rel="stylesheet" href="https://jsdelivr.net" crossorigin="" />
    
    <style>
        /* Memastikan ruang kontainer benar-benar 100% penuh terlihat */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #555555; /* Warna abu-abu gelap */
        }
        
        #map {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Wadah peta -->
    <div id="map"></div>

    <!-- JS Leaflet dari CDN jsDelivr + ATRIBUT CROSSORIGIN -->
    <script src="https://jsdelivr.net" crossorigin=""></script>

    <script>
        // Memastikan seluruh dokumen selesai dimuat di memori browser
        window.addEventListener('DOMContentLoaded', () => {
            
            try {
                // 1. Inisialisasi peta ke koordinat uji coba (Jakarta)
                const map = L.map('map').setView([-6.2088, 106.8456], 13);

                // 2. Menggunakan OpenStreetMap Standar dengan format universal
                L.tileLayer('https://openstreetmap.org{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                // 3. Tambahkan penanda visual untuk pengetesan awal
                L.marker([-6.2088, 106.8456]).addTo(map)
                    .bindPopup('Peta Sukses Dimuat!')
                    .openPopup();

                // TRICK PALING AMPUH: Memaksa browser menghitung ulang ukuran kotak peta 
                // jika Leaflet sempat "bingung" membaca resolusi layar Anda saat booting awal
                setTimeout(() => {
                    map.invalidateSize();
                    console.log("Peta dipaksa render ulang ukuran.");
                }, 500);

            } catch (error) {
                alert("Ada error pada script Leaflet: " + error.message);
            }
            
        });
    </script>

</body>
</html>
