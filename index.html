<!DOCTYPE html>
<html>
   <head>
      <title>Menampilkan 2 Marker Dari Firebase</title>
      <!-- LINK CSS ASLI (TIDAK BERUBAH) -->
      <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
      <!-- LINK JS ASLI (TIDAK BERUBAH) -->
      <script src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
      
      <style>
         /* Reset dasar agar pas dan responsif di layar HP Android/iOS */
         * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
         }
         
         body {
            font-family: Arial, sans-serif;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Menyusun konten atas-bawah secara vertikal di HP */
            overflow: hidden;
            background-color: #fff;
         }

         #wrapper-status {
            margin-bottom: 5px;
            flex-shrink: 0;
         }
         
         /* WADAH TEKS JSON (Dibuat hemat ruang di mobile) */
         #output-json {
            background: #111;
            color: #00ff00;
            padding: 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-width: 650px;
            overflow: auto;
            margin-bottom: 15px;
            line-height: 1.4;
            border: 1px solid #333;
            max-height: 18vh; /* Batas tinggi porsi teks log agar peta bisa mendominasi */
            flex-shrink: 0;
         }
         
         /* KONTANER PETA (Menguasai 80% dari sisa ruang konten aktif di mobile) */
         #map {
            width: 100%;
            max-width: 650px;
            height: 68vh; /* Mengatur porsi tinggi peta agar mendominasi layar HP */
            background-color: #eee;
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
         }

         /* Mengembalikan ke ukuran kaku default sukses Anda jika dibuka di Laptop / PC */
         @media (min-width: 768px) {
            #map {
               height: 450px; 
               flex-grow: 0;
            }
            #output-json {
               max-height: none;
            }
         }
      </style>
   </head>
 
   <body>
      <div id="wrapper-status">
         <h2>Monitoring Multi-Client GPS Pendaki</h2>
         <p style="color: #666; font-size: 14px; margin-bottom: 5px;">Status: Menampilkan Seluruh Client Aktif Berdampingan...</p>
      </div>
      
      <!-- WADAH KHUSUS MENAMPILKAN DATA JSON DI BAWAH BARIS STATUS -->
      <pre id="output-json">Memanggil log teks IoT Firebase...</pre>
      
      <!-- Kontainer Peta sesuai ukuran sukses Anda -->
      <div id = "map"></div>
      
      <script>         
         // Menggunakan tingkat Zoom 5 (Lebih Luas) agar posisi ID_1 dan ID_2 yang berjauhan tetap terlihat bersamaan
         var mapOptions = {
            center: [-6.2088, 106.8456],
            zoom: 5
         }
 
         var map = new L.map('map', mapOptions);            
         var layer = new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');               
         map.addLayer(layer);
 
         // ALAMAT URL FIREBASE ASLI (TIDAK BERUBAH)
         const urlJSON = "https://digimon-iot-8fe36-default-rtdb.firebaseio.com/pendaki.json";

         // Objek memori untuk mengunci ID masing-masing marker agar tidak saling tumpang tindih
         const markers = {};

         async function updateMarkerDariFirebase() {
            try {
                // Trik bypass cache fetch agar data selalu update tiap 3 detik bersih
                const respon = await fetch(`${urlJSON}?nocache=${new Date().getTime()}`);
                const data = await respon.json();
                
                if (data) {
                    let dataTerkonversi = {};

                    // Loop otomatis membaca SATU PER SATU semua ID (id_1, id_2, dll) secara mandiri
                    Object.keys(data).forEach((idKey) => {
                        const item = data[idKey];
                        
                        // Konversi server timestamp menjadi waktu lokal Indonesia
                        let waktuLokal = "Tidak Terdeteksi";
                        if (item.last_online) {
                            const ts = parseInt(item.last_online);
                            waktuLokal = !isNaN(ts) ? new Date(ts).toLocaleString('id-ID') : item.last_online;
                        }

                        // Memastikan koordinat diubah menjadi angka pecahan float murni
                        const lat = parseFloat(item.latitude);
                        const lng = parseFloat(item.longitude);

                        // Masukkan ke struktur objek baru untuk dicetak sebagai teks JSON bersih
                        dataTerkonversi[idKey] = {
                            "latitude": lat,
                            "longitude": lng,
                            "waktu_update": waktuLokal
                        };

                        // Gambar ke peta secara terpisah jika datanya valid angka
                        if (!isNaN(lat) && !isNaN(lng)) {
                            const isiPopup = `<b>📌 ID CLIENT: ${idKey}</b><br>Latitude: ${lat}<br>Longitude: ${lng}<br>Update: ${waktuLokal}`;
                            
                            if (markers[idKey]) {
                                // JIKA ID_1 atau ID_2 SUDAH ADA: Geser posisinya masing-masing tanpa mengganggu ID lain
                                markers[idKey].setLatLng([lat, lng]);
                                markers[idKey].getPopup().setContent(isiPopup);
                            } else {
                                // JIKA ID BARU MUNCUL: Gambar objek marker terpisah untuk masing-masing ID
                                markers[idKey] = L.marker([lat, lng]).addTo(map)
                                    .bindPopup(isiPopup);
                            }
                        }
                    });

                    // CETAK DATA JSON TERKONVERSI TEPAT DI BAWAH BARIS STATUS
                    document.getElementById("output-json").innerText = JSON.stringify(dataTerkonversi, null, 4);

                } else {
                    document.getElementById("output-json").innerText = "Database Terhubung, tetapi kosong.";
                }
            } catch (e) {
                console.error("Gagal memperbarui peta dari Firebase:", e);
                document.getElementById("output-json").innerText = "Gagal memproses data. Periksa koneksi internet.";
            }
         }

         // Jalankan fungsi pembacaan data secara otomatis per 3 detik sekali secara real-time
         updateMarkerDariFirebase();
         setInterval(updateMarkerDariFirebase, 3000);

         // Trik memaksa layout peta ter-render utuh (mencegah blank sisa ruang) setelah halaman terbuka sempurna
         setTimeout(function() {
            map.invalidateSize();
         }, 500);
      </script>
   </body>   
</html>
