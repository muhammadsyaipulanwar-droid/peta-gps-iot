<!DOCTYPE html>
<html>
   <head>
      <title>Menampilkan 2 Marker Dari Firebase</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
      <script src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
      
      <style>
         /* Reset dasar agar pas dan otomatis menyesuaikan lebar penuh layar device */
         * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
         }
         
         body {
            font-family: Arial, sans-serif;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Menyusun konten atas-bawah secara vertikal di HP */
            overflow: hidden;
            background-color: #fff;
         }

         #wrapper-status {
            margin-bottom: 5px;
            flex-shrink: 0;
         }
         
         /* WADAH TEKS LOG (Otomatis 100% mengikuti lebar layar device Anda) */
         #output-json {
            background: #111;
            color: #00ff00;
            padding: 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            width: 100%; /* Lebar penuh otomatis menyesuaikan device */
            overflow: auto;
            margin-bottom: 15px;
            line-height: 1.5;
            border: 1px solid #333;
            max-height: 18vh; /* Batas tinggi porsi teks log di HP */
            flex-shrink: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
         }
         
         /* 🌟 STYLE LOG BERKEDIP MERAH JIKA LOGIKA SOS AKTIF */
         .log-bahaya-aktif {
            background-color: #4a0000 !important;
            color: #ff4d4d !important;
            border: 1px solid #ff0000 !important;
         }
         
         /* KONTANER PETA (Otomatis 100% mengikuti lebar layar device & menguasai 80% porsi area vertikal di HP) */
         #map {
            width: 100%; /* Lebar penuh otomatis menyesuaikan device */
            height: 68vh; /* Mengatur porsi tinggi peta agar mendominasi layar HP */
            background-color: #eee;
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
         }

         /* Penyesuaian otomatis jika dibuka di Laptop / PC desktop */
         @media (min-width: 768px) {
            body {
               padding: 20px; /* Padding lebih luas untuk desktop */
            }
            #map {
               height: 500px; /* Tinggi proporsional untuk desktop */
               flex-grow: 0;
            }
            #output-json {
               max-height: none;
            }
         }
      </style>
   </head>
 
   <body>
      <div id="wrapper-status">
         <h2>Monitoring Multi-Client GPS Pendaki</h2>
         <p style="color: #666; font-size: 14px; margin-bottom: 5px;">Status: Menampilkan Seluruh Client Aktif Berdampingan...</p>
      </div>
      
      <!-- WADAH KHUSUS MENAMPILKAN DATA LOG DI BAWAH BARIS STATUS -->
      <pre id="output-json">Memanggil log teks IoT Firebase...</pre>
      
      <!-- Kontainer Peta otomatis menyesuaikan lebar device -->
      <div id = "map"></div>
<!-- =========================================================================
                    BATAS AWAL BAGIAN 2 - JAVASCRIPT AMAN
     ========================================================================= -->
      <script>         
         // TINGKAT ZOOM DIUBAH MENJADI 18 UNTUK DETAIL MAKSIMAL
         var mapOptions = {
            center: [-2.9156867, 115.1874867],
            zoom: 18
         }
 
         var map = new L.map('map', mapOptions);            
         var layer = new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');               
         map.addLayer(layer);
 
         // ALAMAT URL FIREBASE ASLI (TIDAK BERUBAH)
         const urlJSON = "https://digimon-iot-8fe36-default-rtdb.firebaseio.com/pendaki.json";

         // Objek memori untuk mengunci ID masing-masing marker agar tidak saling tumpang tindih
         const markers = {};

         async function updateMarkerDariFirebase() {
            try {
                // Trik bypass cache fetch agar data selalu update tiap 3 detik bersih
                const respon = await fetch(`${urlJSON}?nocache=${new Date().getTime()}`);
                const data = await respon.json();
                
                if (data) {
                    let teksLogBersih = "";
                    let adaSinyalBahayaGlobal = false; // Penanda untuk memicu warna merah pada wadah log

                    // Loop otomatis membaca SATU PER SATU semua ID (id_1, id_2, dll) secara mandiri
                    Object.keys(data).forEach((idKey) => {
                        const item = data[idKey];
                        
                        // Konversi server timestamp menjadi waktu lokal Indonesia
                        let waktuLokal = "Tidak Terdeteksi";
                        if (item.last_online) {
                            const ts = parseInt(item.last_online);
                            waktuLokal = !isNaN(ts) ? new Date(ts).toLocaleString('id-ID') : item.last_online;
                        }

                        // Memastikan koordinat diubah menjadi angka pecahan float murni
                        const lat = parseFloat(item.latitude);
                        const lng = parseFloat(item.longitude);

                        // MENANGKAP DATA STRING BATERAI DARI FIREBASE
                        let infoBateraiLengkap = "Tidak Ada Data";
                        if (item.baterai !== undefined) {
                            infoBateraiLengkap = item.baterai;
                        } else if (item.battery !== undefined) {
                            infoBateraiLengkap = item.battery;
                        }

                        // 🌟 MENANGKAP DATA STATUS SOS DARI FIREBASE ("aman" / "bahaya")
                        let statusSOS = "aman";
                        if (item.sos !== undefined) {
                            statusSOS = item.sos;
                        }

                        // Jika salah satu pendaki berstatus bahaya, tandai background log
                        if (statusSOS === "bahaya") {
                            adaSinyalBahayaGlobal = true;
                        }

                        // MENYUSUN TEKS LOG BERSIH SESUAI FORMAT REKUES (Ditambah teks info SOS)
                        const labelSOS = (statusSOS === "bahaya") ? "⚠️ [BAHAYA]" : "[Aman]";
                        teksLogBersih += `[${idKey.toUpperCase()}] Lat: ${lat}, Lng: ${lng} | Bat: ${infoBateraiLengkap}% | SOS: ${labelSOS}\n`;
                        teksLogBersih += `└─ Update: ${waktuLokal}\n\n`;

                        // Gambar ke peta secara terpisah jika datanya valid angka
                        if (!isNaN(lat) && !isNaN(lng)) {
                            // 🌟 DESAIN STRUKTUR TEKS POPUP PETA SINKRON REAL-TIME
                            let teksPeringatanPopup = `<span style="color: green; font-weight: bold;">✓ STATUS AMAN</span>`;
                            if (statusSOS === "bahaya") {
                                teksPeringatanPopup = `<span style="color: red; font-weight: bold; background: #ffeeee; padding: 2px 5px; border: 1px solid red; border-radius: 3px;">🚨 DARURAT SOS (BUTUH BANTUAN!)</span>`;
                            }

                            const isiPopup = `<b>📌 ID CLIENT: ${idKey.toUpperCase()}</b><br>
                                              Kondisi: ${teksPeringatanPopup}<br>
                                              Latitude: ${lat}<br>
                                              Longitude: ${lng}<br>
                                              Baterai: ${infoBateraiLengkap}%<br>
                                              Update: ${waktuLokal}`;
                            
                            if (markers[idKey]) {
                                // JIKA ID_1 atau ID_2 SUDAH ADA: Geser posisinya masing-masing tanpa mengganggu ID lain
                                markers[idKey].setLatLng([lat, lng]);
                                markers[idKey].getPopup().setContent(isiPopup);
                            } else {
                                // JIKA ID BARU MUNCUL: Gunakan pin bawaan Leaflet standar agar 100% aman anti-error
                                markers[idKey] = L.marker([lat, lng]).addTo(map)
                                    .bindPopup(isiPopup);
                            }
                        }
                    });

                    // CETAK TEKS LOG BERSIH TEPAT DI BAWAH BARIS STATUS
                    document.getElementById("output-json").innerText = teksLogBersih.trim();

                    // 🌟 PERUBAHAN WARNA LOG BOX SECARA DINAMIS
                    const elemenLog = document.getElementById("output-json");
                    if (adaSinyalBahayaGlobal) {
                        elemenLog.classList.add("log-bahaya-aktif");
                    } else {
                        elemenLog.classList.remove("log-bahaya-aktif");
                    }

                } else {
                    document.getElementById("output-json").innerText = "Database Terhubung, tetapi kosong.";
                    document.getElementById("output-json").classList.remove("log-bahaya-aktif");
                }
            } catch (e) {
                console.error("Gagal memperbarui peta dari Firebase:", e);
                document.getElementById("output-json").innerText = "Gagal memproses data. Periksa koneksi internet.";
                document.getElementById("output-json").classList.remove("log-bahaya-aktif");
            }
         }

         // Jalankan fungsi pembacaan data secara otomatis per 3 detik sekali secara real-time
         updateMarkerDariFirebase();
         setInterval(updateMarkerDariFirebase, 3000);

         // Trik memaksa layout peta ter-render utuh mengikuti lebar device sesaat setelah halaman terbuka sempurna
         setTimeout(function() {
            map.invalidateSize();
         }, 500);

         // Otomatis menghitung ulang ukuran peta jika layar device diputar (di-rotate)
         window.addEventListener('resize', function() {
            map.invalidateSize();
         });
      </script>
   </body>   
</html>
