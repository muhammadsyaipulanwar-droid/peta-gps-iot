<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teks Monitor Firebase Terkonversi</title>
</head>
<body style="font-family: monospace; padding: 20px; background: #222; color: #00ff00;">

    <h2>[ LIVE DATA MONITOR ]</h2>
    <hr style="border-color: #00ff00;">
    
    <!-- Wadah Teks Hijau Server -->
    <pre id="output-teks" style="font-size: 16px; white-space: pre-wrap; line-height: 1.5;">Memanggil data IoT...</pre>

    <script>
        // URL akses publik database Anda yang terbukti sukses
        const urlJSON = "https://firebaseio.com";

        async function bacaDanKonversiTeks() {
            try {
                // Bypass cache agar teks selalu ter-update otomatis tiap 3 detik
                const respon = await fetch(`${urlJSON}?nocache=${new Date().getTime()}`);
                const data = await respon.json();
                
                if (data) {
                    // Membuat objek salinan untuk memodifikasi tampilan waktu tanpa merusak data asli
                    let dataTerkonversi = {};

                    // Melakukan perulangan otomatis membaca id_1, id_2, dst.
                    Object.keys(data).forEach((idKey) => {
                        const item = data[idKey];
                        
                        // Ambil dan konversi otomatis server timestamp menjadi format Jam Tanggal Indonesia
                        let waktuLokal = "Tidak Terdeteksi";
                        if (item.last_online) {
                            const ts = parseInt(item.last_online);
                            waktuLokal = !isNaN(ts) ? new Date(ts).toLocaleString('id-ID') : item.last_online;
                        }

                        // Masukkan ke struktur teks baru yang bersih
                        dataTerkonversi[idKey] = {
                            "latitude": parseFloat(item.latitude),
                            "longitude": parseFloat(item.longitude),
                            "waktu_update": waktuLokal
                        };
                    });

                    // Cetak seluruh hasil struktur teks ke layar HP Android Anda dengan rapi
                    document.getElementById("output-teks").innerText = JSON.stringify(dataTerkonversi, null, 4);
                } else {
                    document.getElementById("output-teks").innerText = "Database Terhubung, tetapi kosong.";
                }
            } catch (e) {
                document.getElementById("output-teks").innerText = "Gagal mengambil teks. Periksa Rules Firebase Anda.";
            }
        }

        // Jalankan pengecekan data otomatis setiap 3 detik sekali secara real-time
        bacaDanKonversiTeks();
        setInterval(bacaDanKonversiTeks, 3000);
    </script>

</body>
</html>
