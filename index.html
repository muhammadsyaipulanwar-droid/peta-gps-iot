<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Monitoring Pendaki Real-Time</title>
    
    <!-- CSS Leaflet untuk Peta (Menggunakan CDN Online) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        /* Mengatur agar peta memenuhi seluruh layar browser */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Desain kotak informasi tambahan di pojok peta */
        .info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            min-width: 200px;
        }
        .info-box h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .info-box p { margin: 5px 0; font-size: 13px; color: #555; }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #2ecc71;
            border-radius: 50%;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <!-- Wadah Kotak Informasi Terkini -->
    <div class="info-box">
        <h3><span class="status-dot"></span> Monitoring: ID 1</h3>
        <p><strong>Latitude:</strong> <span id="txt-lat">-</span></p>
        <p><strong>Longitude:</strong> <span id="txt-lng">-</span></p>
        <p><strong>Last Online:</strong> <span id="txt-online">-</span></p>
    </div>

    <!-- Wadah Utama Tempat Peta Ditampilkan -->
    <div id="map"></div>

    <!-- JavaScript Leaflet.js -->
    <script src="https://unpkg.com"></script>

    <!-- Menggunakan Firebase Versi Kompatibilitas via Cloudflare CDN (Bebas Error CORS & MIME) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        // Kredensial Firebase Resmi Proyek Anda
        const firebaseConfig = {
            apiKey: "AIzaSyArmLd5ByLoCm3RwQ_eGbpJIAUdoyM0D5E",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "digimon-iot-8fe36",
            storageBucket: "digimon-iot-8fe36.firebasestorage.app",
            messagingSenderId: "315467255779",
            appId: "1:315467255779:web:299993f92f6cce31ccdad6"
        };

        // Inisialisasi Firebase (Format kompatibilitas skrip umum)
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Inisialisasi Peta Awal (Titik tengah default diatur ke Indonesia)
        const map = L.map('map').setView([-2.5489, 118.0149], 5);

        // Load gambar peta grafis dari OpenStreetMap gratis
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Siapkan variabel kosong untuk Marker (Penanda)
        let pendakiMarker = null;

        // Ambil data secara Real-Time dari path /pendaki/id_1
        const pendakiRef = database.ref('pendaki/id_1');

        pendakiRef.on('value', (snapshot) => {
            const data = snapshot.val();
            
            // Validasi apakah data koordinat masuk dan tidak kosong
            if (data && data.latitude && data.longitude) {
                const lat = parseFloat(data.latitude);
                const lng = parseFloat(data.longitude);
                
                // Format tanggal Last Online
                let waktuOnline = "Tidak diketahui";
                if (data.last_online) {
                    waktuOnline = typeof data.last_online === 'number' 
                        ? new Date(data.last_online).toLocaleString('id-ID') 
                        : data.last_online;
                }

                // Update teks di Kotak Informasi pojok kanan atas
                document.getElementById('txt-lat').innerText = lat;
                document.getElementById('txt-lng').innerText = lng;
                document.getElementById('txt-online').innerText = waktuOnline;

                // Teks yang muncul di dalam balon popup saat marker diklik
                const popupContent = `
                    <div style="font-size:13px;">
                        <b>Pendaki ID_1</b><br>
                        Status: Aktif Bergerak<br>
                        <small>Last Online: ${waktuOnline}</small>
                    </div>
                `;

                if (pendakiMarker === null) {
                    // Jika web baru dibuka & marker belum ada di peta, buat baru
                    pendakiMarker = L.marker([lat, lng]).addTo(map);
                    pendakiMarker.bindPopup(popupContent).openPopup();
                    
                    // Zoom otomatis lebih dekat ke posisi pendaki saat pertama kali terdeteksi
                    map.setView([lat, lng], 15);
                } else {
                    // Jika marker sudah ada, geser posisinya secara halus
                    pendakiMarker.setLatLng([lat, lng]);
                    pendakiMarker.setPopupContent(popupContent);
                    
                    // Kamera peta akan otomatis bergeser mengikuti pergerakan marker
                    map.panTo([lat, lng]);
                }
            } else {
                console.warn("Data dari Firebase diterima, tetapi koordinat latitude/longitude kosong.");
            }
        });
    </script>
</body>
</html>
