    <!-- CORE SCRIPT IMPLEMENTASI PETA -->
    <script>
        // Menggunakan block try-catch pembungkus agar browser mengeksekusi dengan aman
        window.addEventListener('DOMContentLoaded', () => {
            try {
                // 1. Inisialisasi peta ke koordinat uji coba (Jakarta)
                // Menggunakan variabel 'L' yang sekarang dijamin terdefinisi dari script di atas
                const map = L.map('map').setView([-6.2088, 106.8456], 13);

                // 2. Load layer pemetaan dasar
                L.tileLayer('https://openstreetmap.org{z}/{x}/{y}.png').addTo(map);

                // 3. Tambahkan penanda pin ke layar untuk verifikasi
                L.marker([-6.2088, 106.8456]).addTo(map)
                    .bindPopup('Sistem Inti Peta Berhasil Lolos dari Error!')
                    .openPopup();
                
            } catch (error) {
                document.body.innerHTML = "<div style='color:red; padding:30px; font-family:monospace;'><h3>Terjadi Masalah Eksekusi:</h3>" + error.message + "</div>";
            }
        });
    </script>
