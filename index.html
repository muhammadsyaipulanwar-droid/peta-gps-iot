<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teks Monitor Firebase</title>
</head>
<body style="font-family: monospace; padding: 20px; background: #222; color: #00ff00;">

    <h2>[ LIVE DATA MONITOR ]</h2>
    <hr style="border-color: #00ff00;">
    
    <!-- Wadah Teks Hijau seperti layar komputer server -->
    <pre id="output-teks" style="font-size: 16px; white-space: pre-wrap;">Memanggil data IoT...</pre>

    <script>
        // URL akses publik database Anda
        const urlJSON = "https://firebaseio.com";

        async function bacaDataTeks() {
            try {
                // Bypass cache agar teks selalu ter-update otomatis tiap detik
                const respon = await fetch(`${urlJSON}?nocache=${new Date().getTime()}`);
                const data = await respon.json();
                
                if (data) {
                    // Cetak semua data ke layar dalam bentuk string teks rapi
                    document.getElementById("output-teks").innerText = JSON.stringify(data, null, 4);
                } else {
                    document.getElementById("output-teks").innerText = "Database Terhubung, tetapi kosong.";
                }
            } catch (e) {
                document.getElementById("output-teks").innerText = "Gagal mengambil teks. Pastikan Rules Firebase Anda sudah diset ke true.";
            }
        }

        // Cek data otomatis setiap 3 detik sekali
        bacaDataTeks();
        setInterval(bacaDataTeks, 3000);
    </script>

</body>
</html>
