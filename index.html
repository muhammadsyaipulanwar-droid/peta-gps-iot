<!DOCTYPE html>
<html>
   <head>
      <title>Menampilkan Marker Pada Map</title>
      <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
      <script src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   </head>
 
   <body>
      <h2>MalasNgoding.com - Menampilkan Marker Pada Map</h2>
      <div id = "map" style = "width: 650px; height: 450px"></div>
      <script>         
         var mapOptions = {
            center: [-6.2293796, 106.6647002],
            zoom: 10
         }
 
         var map = new L.map('map', mapOptions);            
         var layer = new L.TileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');               
         map.addLayer(layer);
 
         var marker = L.marker([-6.232228, 106.847793]).addTo(map);
 
      </script>
   </body>   
</html>
