        /* Layout Pembagian Layar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            height: 100vh;
            font-family: monospace;
            background: #222;
            color: #00ff00;
            overflow: hidden;
        }
        
        /* Sisi Kiri: Log Teks Hijau Asli Anda */
        #panel-log {
            width: 360px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #00ff00;
            background: #111;
            overflow-y: auto;
            height: 100vh;
        }
        #output-teks {
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.4;
            color: #00ff00;
            margin-top: 15px;
        }

        /* Sisi Kanan: Kontainer Peta */
        #map {
            flex: 1;
            height: 100vh;
            background: #333;
        }
    </style>
</head>
<body>

    <!-- PANEL LOG TEKS ASLI ANDA -->
    <div id="panel-log">
        <h2>[ LIVE DATA MONITOR ]</h2>
        <p style="font-size: 11px; color: #888;">Firebase Fetch -> Real-time Map</p>
        <hr style="border-color: #00ff00; margin-top: 10px;">
        <pre id="output-teks">Menghubungkan ke IoT & Peta...</pre>
    </div>

    <!-- PANEL PETA VISUAL -->
    <div id="map"></div>

    <script>

    <!-- CORE LOGIKA UTAMA -->
    <script>
        // URL akses publik database Anda yang terbukti sukses
        const urlJSON = "https://firebaseio.com";

        // Inisialisasi Peta Aman
        const map = L.map('map').setView([-6.2088, 106.8456], 13);
        L.tileLayer('https://openstreetmap.org{z}/{x}/{y}.png').addTo(map);

        // Objek penampung penanda pin pendaki
        const markers = {};

        async function bacaDanKonversiTeks() {
            try {
                // Sesuai kode asli Anda: bypass cache fetch setiap 3 detik
                const respon = await fetch(`${urlJSON}?nocache=${new Date().getTime()}`);
                const data = await respon.json();
                
                if (data) {
                    let dataTerkonversi = {};

                    Object.keys(data).forEach((idKey) => {
                        const item = data[idKey];
                        
                        // Konversi waktu (Sesuai kode asli Anda)
                        let waktuLokal = "Tidak Terdeteksi";
                        if (item.last_online) {
                            const ts = parseInt(item.last_online);
                            waktuLokal = !isNaN(ts) ? new Date(ts).toLocaleString('id-ID') : item.last_online;
                        }

                        const lat = parseFloat(item.latitude);
                        const lng = parseFloat(item.longitude);

                        // Masukkan ke struktur teks log kiri
                        dataTerkonversi[idKey] = {
                            "latitude": lat,
                            "longitude": lng,
                            "waktu_update": waktuLokal
                        };

                        // PEMETAAN VISUAL PIN DI PETA SECARA REAL-TIME
                        if (!isNaN(lat) && !isNaN(lng)) {
                            const infoPopup = `<b>📌 ID: ${idKey}</b><br>Lat: ${lat}<br>Lng: ${lng}<br>Jam: ${waktuLokal}`;
                            
                            if (markers[idKey]) {
                                // Jika pendaki sudah ada, geser pin dan update balon teksnya
                                markers[idKey].setLatLng([lat, lng]);
                                markers[idKey].getPopup().setContent(infoPopup);
                            } else {
                                // Jika baru terdeteksi, gambar pin baru berwarna hijau
                                markers[idKey] = L.marker([lat, lng]).addTo(map)
                                    .bindPopup(infoPopup);
                            }
                        }
                    });

                    // Cetak hasil string JSON ke panel monitor hijau (Sesuai kode asli Anda)
                    document.getElementById("output-teks").innerText = JSON.stringify(dataTerkonversi, null, 4);
                } else {
                    document.getElementById("output-teks").innerText = "Database Terhubung, tetapi kosong.";
                }
            } catch (e) {
document.getElementById("output-teks").innerText = "Gagal mengambil data. Periksa Koneksi/Rules Firebase.";}}// Jalankan looping real-time per 3 detikbacaDanKonversiTeks();setInterval(bacaDanKonversiTeks, 3000);
