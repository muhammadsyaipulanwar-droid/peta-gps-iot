<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba Ambil Data IoT</title>
</head>
<body>

    <h1>Data Mentah Pengujian Firebase:</h1>
    <hr>
    
    <!-- Wadah Teks -->
    <pre id="tampil-data" style="font-size: 16px; background: #eee; padding: 15px; border-radius: 5px; overflow-x: auto;">
        Mencoba menghubungkan ke server Firebase...
    </pre>

    <script>
        // Dua kemungkinan variasi URL Firebase milik Anda
        const URL_OPSI_A = "https://firebaseio.com";
        const URL_OPSI_B = "https://firebaseio.com";

        async function mulaiAmbilData() {
            const wadahTeks = document.getElementById("tampil-data");
            
            // --- Percobaan Jalur A ---
            try {
                console.log("Mencoba Jalur A...");
                const respon = await fetch(`${URL_OPSI_A}?nocache=${new Date().getTime()}`);
                if (respon.ok) {
                    const data = await respon.json();
                    if (data) {
                        wadahTeks.innerText = "SUKSES LEWAT JALUR A!\n\n" + JSON.stringify(data, null, 2);
                        return; // Berhenti karena sukses
                    }
                }
            } catch (e) {
                console.log("Jalur A gagal, beralih ke Jalur B...");
            }

            // --- Percobaan Jalur B ---
            try {
                console.log("Mencoba Jalur B...");
                const respon = await fetch(`${URL_OPSI_B}?nocache=${new Date().getTime()}`);
                if (respon.ok) {
                    const data = await respon.json();
                    if (data) {
                        wadahTeks.innerText = "SUKSES LEWAT JALUR B!\n\n" + JSON.stringify(data, null, 2);
                        return; // Berhenti karena sukses
                    }
                }
            } catch (e) {
                console.log("Jalur B juga gagal.");
            }

            // Jika kedua jalur ditolak
            wadahTeks.innerText = "Error: Kedua jalur URL Firebase ditolak oleh browser Android Anda.\n\n" +
                                  "Solusi Terakhir:\n" +
                                  "1. Buka Firebase Console Anda lewat HP.\n" +
                                  "2. Masuk ke Realtime Database.\n" +
                                  "3. Salin/copy teks URL persis yang tertera di bagian paling atas database Anda (yang berlogo rantai/link), lalu kirimkan teks URL tersebut ke sini.";
        }

        // Jalankan pengujian
        mulaiAmbilData();
    </script>

</body>
</html>
