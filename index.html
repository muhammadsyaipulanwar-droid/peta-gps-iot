<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Data Mentah Firebase</title>
</head>
<body>

    <h1>Data Mentah Proyek IoT Anda:</h1>
    <hr>
    
    <!-- Wadah untuk menampilkan seluruh isi database -->
    <pre id="tampil-data" style="font-size: 16px; background: #eee; padding: 15px; border-radius: 5px;">
        Sedang menarik data dari Firebase...
    </pre>

    <script>
        // URL utama database Firebase Anda untuk melihat semua data (.json)
        const URL_DATABASE = "https://firebaseio.com";

        async function ambilSemuaData() {
            try {
                // Tambahkan timestamp acak agar browser HP tidak terjebak cache lama
                const respon = await fetch(`${URL_DATABASE}?nocache=${new Date().getTime()}`);
                
                if (!respon.ok) {
                    throw new Error("Gagal terhubung. Pastikan Rules Firebase sudah di-set ke true.");
                }
                
                const dataMentah = await respon.json();
                
                if (dataMentah === null) {
                    document.getElementById("tampil-data").innerText = "Database Anda aktif, tetapi isinya kosong (kosong melompong).";
                } else {
                    // Mengubah objek database menjadi tulisan rapi (JSON stringify) agar mudah dibaca di layar
                    document.getElementById("tampil-data").innerText = JSON.stringify(dataMentah, null, 2);
                }
            } catch (error) {
                document.getElementById("tampil-data").innerText = "Error: " + error.message;
            }
        }

        // Jalankan fungsi pengambilan data
        ambilSemuaData();
    </script>

</body>
</html>
