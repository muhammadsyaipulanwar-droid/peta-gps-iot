<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Leaflet Saja</title>
    
    <!-- 1. CSS LEAFLET RESMI DARI CDN CLOUDFLARE -->
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-Zcn693ZgPn7cAaALVov3zUv+2C6G9pUtdXfFA5Ipx0AecDDFBvHshq0mN4l+qWpB13uV8HlW+xN/1UeC09Kng==" crossorigin="" />
    
    <style>
        /* Memaksa peta memenuhi seluruh layar HP / Komputer */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Latar belakang gelap */
        }
        #map {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Wadah Tunggal Peta -->
    <div id="map"></div>

    <!-- 2. JAVASCRIPT LEAFLET RESMI DARI CDN CLOUDFLARE -->
    <script src="https://cloudflare.com" integrity="sha512-Bw3bT6yA6zS6fEFE2C7H5/H5eF72u1/A4T/tW48z03vE14AecM3c7N7EfaP1B4mZUp7Gf5D7U1B8vH5O0RzNlw==" crossorigin=""></script>

    <script>
        // Menunggu seluruh elemen halaman siap
        window.addEventListener('DOMContentLoaded', () => {
            try {
                // 3. Inisialisasi peta (Fokus awal ke koordinat Jakarta)
                const map = L.map('map').setView([-6.2088, 106.8456], 11);

                // 4. Memuat Gambar Peta dari OpenStreetMap
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                // 5. PILIHAN DARURAT: Jika gambar peta internet diblokir,
                // baris di bawah ini akan menggambar garis kotak koordinat abu-abu di layar Anda.
                L.gridLayer({
                    attribution: 'Grid Darurat Aktif'
                }).createTile = function(coords) {
                    var tile = document.createElement('div');
                    tile.style.outline = '1px solid rgba(255,255,255,0.2)';
                    tile.style.color = '#00ff00';
                    tile.style.fontFamily = 'monospace';
                    tile.style.fontSize = '10px';
                    tile.style.padding = '5px';
                    tile.innerHTML = 'X:' + coords.x + ', Y:' + coords.y + ', Z:' + coords.z;
                    return tile;
                };
                map.addLayer(L.gridLayer());

                // 6. Menaruh pin penanda di tengah layar
                L.marker([-6.2088, 106.8456]).addTo(map)
                    .bindPopup('<b>Sistem Peta Aktif!</b><br>Koordinat: -6.2088, 106.8456')
                    .openPopup();

                // Memaksa render ulang ukuran agar pas dengan layar browser
                setTimeout(() => {
                    map.invalidateSize();
                }, 300);

            } catch (error) {
                // Menampilkan kotak pesan jika ada kode script yang macet
                alert("Gagal memicu Leaflet: " + error.message);
            }
        });
    </script>

</body>
</html>
