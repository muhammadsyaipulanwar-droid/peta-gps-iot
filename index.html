<!DOCTYPE html>
<html>
   <head>
      <title>Menampilkan Marker & Status SOS Dari Firebase</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
      <script src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
      
      <style>
         /* Reset dasar agar pas dan otomatis menyesuaikan lebar penuh layar device */
         * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
         }
         
         body {
            font-family: Arial, sans-serif;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Menyusun konten atas-bawah secara HP */
            overflow: hidden;
            background-color: #fff;
         }

         #wrapper-status {
            margin-bottom: 5px;
            flex-shrink: 0;
         }
         
         /* WADAH TEKS LOG (Otomatis 100% mengikuti lebar layar device Anda) */
         #output-json {
            background: #111;
            color: #00ff00;
            padding: 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            width: 100%; 
            overflow: auto;
            margin-bottom: 15px;
            line-height: 1.5;
            border: 1px solid #333;
            max-height: 18vh; /* Batas tinggi porsi teks log di HP */
            flex-shrink: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease;
         }

         /* 🌟 STYLE EFEK BERKEDIP JIKA STATUS CLIENT MEMILIKI BAHAYA (SOS) */
         .log-bahaya-aktif {
            background-color: #550000 !important; 
            color: #ff3333 !important; 
            border: 2px solid #ff0000 !important;
            animation: kedipMerah 1s infinite alternate;
         }

         @keyframes kedipMerah {
            from { border-color: #ff0000; box-shadow: 0 0 5px #ff0000; }
            to { border-color: #330000; box-shadow: 0 0 0px #330000; }
         }

         /* 🌟 STYLE ICON LINGKARAN SOS MERAH BERKEDIP PADA PETA */
         .sos-marker-pulsa {
            background: #ff3333;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(255, 51, 51, 1);
            animation: pulsa-merah 1.2s infinite;
         }

         @keyframes pulsa-merah {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(255, 51, 51, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
         }
         
         /* KONTANER PETA */
         #map {
            width: 100%; 
            height: 68vh; /* Mengatur porsi tinggi peta agar mendominasi layar HP */
            background-color: #eee;
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 1;
         }

         /* Penyesuaian otomatis jika dibuka di PC desktop */
         @media (min-width: 768px) {
            body {
               padding: 20px; 
            }
            #map {
               height: 500px; 
               flex-grow: 0;
            }
            #output-json {
               max-height: none;
            }
         }
      </style>
   </head>
 
   <body>
      <div id="wrapper-status">
         <h2>Monitoring Multi-Client GPS Pendaki</h2>
         <p style="color: #666; font-size: 14px; margin-bottom: 5px;">Status: Menampilkan Seluruh Client Aktif Berdampingan...</p>
      </div>
      
      <!-- WADAH TEKS LOG IOT -->
      <pre id="output-json">Memanggil log teks IoT Firebase...</pre>
      
      <!-- Kontainer Peta -->
      <div id="map"></div>
<!-- =========================================================================
                    BATAS AWAL BAGIAN 2 - LOGIKA JAVASCRIPT
     ========================================================================= -->
      <script>         
         // Inisialisasi peta dengan tingkat zoom 18 untuk detail maksimal
         var mapOptions = {
            center: [-2.9156867, 115.1874867],
            zoom: 18
         }
 
         var map = new L.map('map', mapOptions);            
         var layer = new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');               
         map.addLayer(layer);
 
         // ALAMAT URL FIREBASE ASLI (TIDAK BERUBAH)
         const urlJSON = "https://digimon-iot-8fe36-default-rtdb.firebaseio.com/pendaki.json";

         // Objek memori untuk mengunci ID masing-masing marker agar tidak saling tumpang tindih
         const markers = {};

         async function updateMarkerDariFirebase() {
            try {
                // Trik bypass cache fetch agar data selalu update tiap 3 detik bersih
                const respon = await fetch(`${urlJSON}?nocache=${new Date().getTime()}`);
                const data = await respon.json();
                
                if (data) {
                    let teksLogBersih = "";
                    let adaSinyalBahayaGlobal = false; // Penanda untuk memicu kedip merah pada wadah log

                    // Loop otomatis membaca SATU PER SATU semua ID (id_1, id_2, dll) secara mandiri
                    Object.keys(data).forEach((idKey) => {
                        const item = data[idKey];
                        
                        // Konversi server timestamp menjadi waktu lokal Indonesia
                        let waktuLokal = "Tidak Terdeteksi";
                        if (item.last_online) {
                            const ts = parseInt(item.last_online);
                            waktuLokal = !isNaN(ts) ? new Date(ts).toLocaleString('id-ID') : item.last_online;
                        }

                        // Memastikan koordinat diubah menjadi angka pecahan float murni
                        const lat = parseFloat(item.latitude);
                        const lng = parseFloat(item.longitude);

                        // Menangkap data baterai dari Firebase
                        let infoBateraiLengkap = "Tidak Ada Data";
                        if (item.baterai !== undefined) {
                            infoBateraiLengkap = item.baterai;
                        } else if (item.battery !== undefined) {
                            infoBateraiLengkap = item.battery;
                        }

                        // Menangkap data status SOS baru ("aman" / "bahaya")
                        let statusSOS = "aman"; 
                        if (item.sos !== undefined) {
                            statusSOS = item.sos;
                        }

                        // Jika ada minimal satu client berstatus bahaya, tandai alarm global aktif
                        if (statusSOS === "bahaya") {
                            adaSinyalBahayaGlobal = true;
                        }

                        // Menyusun teks log bersih (Ditambah Info Darurat SOS)
                        const tandaPeringatan = (statusSOS === "bahaya") ? "⚠️ [DARURAT - SOS!]" : "[Aman]";
                        teksLogBersih += `[${idKey.toUpperCase()}] Lat: ${lat}, Lng: ${lng} | Bat: ${infoBateraiLengkap}% | SOS: ${tandaPeringatan}\n`;
                        teksLogBersih += `└─ Update: ${waktuLokal}\n\n`;

                        // Gambar ke peta secara terpisah jika datanya valid angka
                        if (!isNaN(lat) && !isNaN(lng)) {
                            
                            // Desain teks balon popup di peta
                            let teksPopupSOS = `<span style="color: green; font-weight: bold;">✅ AMAN</span>`;
                            let opsiIconKustom = null; // Default pin biru Leaflet

                            if (statusSOS === "bahaya") {
                                teksPopupSOS = `<span style="color: red; font-weight: bold; background: yellow; padding: 2px 5px; border-radius: 3px; animation: blinker 1s linear infinite;">⚠️ DARURAT SOS (BUTUH BANTUAN!)</span>
                                <style>@keyframes blinker { 50% { opacity: 0; } }</style>`;
                                
                                // Membuat marker lingkaran berkedip merah (divIcon) ukuran 16x16 pixel dengan posisi jangkar pas di tengah (8,8)
                                opsiIconKustom = L.divIcon({
                                    className: 'sos-marker-pulsa',
                                    iconSize:,
                                    iconAnchor: [8, 8]
                                });
                            }

                            const isiPopup = `<b>📌 ID CLIENT: ${idKey.toUpperCase()}</b><br>
                                              Status: ${teksPopupSOS}<br>
                                              Latitude: ${lat}<br>
                                              Longitude: ${lng}<br>
                                              Baterai: ${infoBateraiLengkap}%<br>
                                              Update: ${waktuLokal}`;
                            
                            if (markers[idKey]) {
                                // Jika ID sudah ada di peta: Geser kordinatnya dan perbarui popup-nya
                                markers[idKey].setLatLng([lat, lng]);
                                markers[idKey].getPopup().setContent(isiPopup);
                                
                                // Ganti wujud ikon marker secara dinamis berdasarkan status SOS terkini
                                if (opsiIconKustom) {
                                    markers[idKey].setIcon(opsiIconKustom);
                                } else {
                                    markers[idKey].setIcon(new L.Icon.Default());
                                }
                            } else {
                                // Jika ID baru muncul di database: Buat objek marker barunya
                                if (opsiIconKustom) {
                                    markers[idKey] = L.marker([lat, lng], {icon: opsiIconKustom}).addTo(map).bindPopup(isiPopup);
                                } else {
                                    markers[idKey] = L.marker([lat, lng]).addTo(map).bindPopup(isiPopup);
                                }
                            }
                        }
                    });

                    // Cetak teks log bersih ke elemen pre
                    document.getElementById("output-json").innerText = teksLogBersih.trim();

                    // Reaksi efek kedip merah pada kotak log hitam
                    const elemenLog = document.getElementById("output-json");
                    if (adaSinyalBahayaGlobal) {
                        elemenLog.classList.add("log-bahaya-aktif");
                    } else {
                        elemenLog.classList.remove("log-bahaya-aktif");
                    }

                } else {
                    document.getElementById("output-json").innerText = "Database Terhubung, tetapi kosong.";
                    document.getElementById("output-json").classList.remove("log-bahaya-aktif");
                }
            } catch (e) {
                console.error("Gagal memperbarui peta dari Firebase:", e);
                document.getElementById("output-json").innerText = "Gagal memproses data. Periksa koneksi internet.";
                document.getElementById("output-json").classList.remove("log-bahaya-aktif");
            }
         }

         // Jalankan fungsi pembacaan data secara otomatis per 3 detik sekali secara real-time
         updateMarkerDariFirebase();
         setInterval(updateMarkerDariFirebase, 3000);

         // Trik memaksa layout peta ter-render utuh mengikuti lebar device sesaat setelah halaman terbuka sempurna
         setTimeout(function() {
            map.invalidateSize();
         }, 500);

         // Otomatis menghitung ulang ukuran peta jika layar device diputar (di-rotate)
         window.addEventListener('resize', function() {
            map.invalidateSize();
         });
      </script>
   </body>   
</html>
