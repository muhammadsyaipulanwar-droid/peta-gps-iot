<!DOCTYPE html>
<html>
   <head>
      <title>Menampilkan Marker & Status SOS Dari Firebase</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel = "stylesheet" href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
      <script src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
      
      <style>
         /* Reset dasar agar pas dan otomatis menyesuaikan lebar penuh layar device */
         * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
         }
         
         body {
            font-family: Arial, sans-serif;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Menyusun konten atas-bawah secara vertikal di HP */
            overflow: hidden;
            background-color: #fff;
         }

         #wrapper-status {
            margin-bottom: 5px;
            flex-shrink: 0;
         }
         
         /* WADAH TEKS LOG (Otomatis 100% mengikuti lebar layar device Anda) */
         #output-json {
            background: #111;
            color: #00ff00;
            padding: 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            width: 100%; /* Lebar penuh otomatis menyesuaikan device */
            overflow: auto;
            margin-bottom: 15px;
            line-height: 1.5;
            border: 1px solid #333;
            max-height: 18vh; /* Batas tinggi porsi teks log di HP */
            flex-shrink: 0;
            transition: background-color 0.3s ease;
         }

         /* 🌟 STYLE EFEK BERKEDIP JIKA STATUS CLIENT MEMILIKI BAHAYA (SOS) */
         .log-bahaya-aktif {
            background-color: #550000 !important; /* Mengubah background menjadi merah tua */
            color: #ff3333 !important; /* Mengubah teks log menjadi merah terang */
            border: 2px solid #ff0000 !important;
            animation: kedipMerah 1s infinite alternate;
         }

         @keyframes kedipMerah {
            from { border-color: #ff0000; box-shadow: 0 0 5px #ff0000; }
            to { border-color: #330000; box-shadow: 0 0 0px #330000; }
         }
         
         /* KONTANER PETA (Otomatis 100% mengikuti lebar layar device & menguasai 80% porsi area vertikal di HP) */
         #map {
            width: 100%; /* Lebar penuh otomatis menyesuaikan device */
            height: 68vh; /* Mengatur porsi tinggi peta agar mendominasi layar HP */
            background-color: #eee;
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
         }

         /* Penyesuaian otomatis jika dibuka di Laptop / PC desktop */
         @media (min-width: 768px) {
            body {
               padding: 20px; /* Padding lebih luas untuk desktop */
            }
            #map {
               height: 500px; /* Tinggi proporsional untuk desktop */
               flex-grow: 0;
            }
            #output-json {
               max-height: none;
            }
         }
      </style>
   </head>
 
   <body>
      <div id="wrapper-status">
         <h2>Monitoring Multi-Client GPS Pendaki</h2>
         <p style="color: #666; font-size: 14px; margin-bottom: 5px;">Status: Menampilkan Seluruh Client Aktif Berdampingan...</p>
      </div>
      
      <!-- WADAH KHUSUS MENAMPILKAN DATA LOG DI BAWAH BARIS STATUS -->
      <pre id="output-json">Memanggil log teks IoT Firebase...</pre>
      
      <!-- Kontainer Peta otomatis menyesuaikan lebar device -->
      <div id = "map"></div>
      
      <script>         
         // TINGKAT ZOOM DIUBAH MENJADI 18 UNTUK DETAIL MAKSIMAL
         var mapOptions = {
            center: [-2.9156867, 115.1874867],
            zoom: 18
         }
 
         var map = new L.map('map', mapOptions);            
         var layer = new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');               
         map.addLayer(layer);
 
         // ALAMAT URL FIREBASE ASLI (TIDAK BERUBAH)
         const urlJSON = "https://digimon-iot-8fe36-default-rtdb.firebaseio.com/pendaki.json";

         // Objek memori untuk mengunci ID masing-masing marker agar tidak saling tumpang tahmin
         const markers = {};

         async function updateMarkerDariFirebase() {
            try {
                // Trik bypass cache fetch agar data selalu update tiap 3 detik bersih
                const respon = await fetch(`${urlJSON}?nocache=${new Date().getTime()}`);
                const data = await respon.json();
                
                if (data) {
                    let teksLogBersih = "";
                    let adaSinyalBahayaGlobal = false; // Penanda untuk memicu kedip merah pada wadah log

                    // Loop otomatis membaca SATU PER SATU semua ID (id_1, id_2, dll) secara mandiri
                    Object.keys(data).forEach((idKey) => {
                        const item = data[idKey];
                        
                        // Konversi server timestamp menjadi waktu lokal Indonesia
                        let waktuLokal = "Tidak Terdeteksi";
                        if (item.last_online) {
                            const ts = parseInt(item.last_online);
                            waktuLokal = !isNaN(ts) ? new Date(ts).toLocaleString('id-ID') : item.last_online;
                        }

                        // Memastikan koordinat diubah menjadi angka pecahan float murni
                        const lat = parseFloat(item.latitude);
                        const lng = parseFloat(item.longitude);

                        // MENANGKAP DATA STRING BATERAI BARU DARI FIREBASE (Hanya Angka Depannya Saja)
                        let infoBateraiLengkap = "Tidak Ada Data";
                        if (item.baterai !== undefined) {
                            infoBateraiLengkap = item.baterai;
                        } else if (item.battery !== undefined) {
                            infoBateraiLengkap = item.battery;
                        }

                        // 🌟 MENANGKAP DATA STATUS SOS BARU DARI FIREBASE ("aman" / "bahaya")
                        let statusSOS = "aman"; 
                        if (item.sos !== undefined) {
                            statusSOS = item.sos;
                        }

                        // Jika ada minimal satu client berstatus bahaya, tandai sinyal bahaya global aktif
                        if (statusSOS === "bahaya") {
                            adaSinyalBahayaGlobal = true;
                        }

                        // MENYUSUN TEKS LOG BERSIH SESUAI FORMAT REKUES (Ditambah Info Darurat SOS)
                        const tandaPeringatan = (statusSOS === "bahaya") ? "⚠️ [DARURAT - SOS!]" : "[Aman]";
                        teksLogBersih += `[${idKey.toUpperCase()}] Lat: ${lat}, Lng: ${lng} | Bat: ${infoBateraiLengkap}% | SOS: ${tandaPeringatan}\n`;
                        teksLogBersih += `└─ Update: ${waktuLokal}\n\n`;

                        // Gambar ke peta secara terpisah jika datanya valid angka
                        if (!isNaN(lat) && !isNaN(lng)) {
                            
                            // 🌟 DESAIN BALON POPUP: Jika status bahaya, teks di popup akan berubah jadi merah tebal berkilau
                            let teksPopupSOS = `<span style="color: green; font-weight: bold;">✅ AMAN</span>`;
                            if (statusSOS === "bahaya") {
                                teksPopupSOS = `<span style="color: red; font-weight: bold; background: yellow; padding: 2px 5px; border-radius: 3px; animation: blinker 1s linear infinite;">⚠️ DARURAT SOS (BUTUH BANTUAN!)</span>
                                <style>@keyframes blinker { 50% { opacity: 0; } }</style>`;
                            }

                            const isiPopup = `<b>📌 ID CLIENT: ${idKey.toUpperCase()}</b><br>
                                              Status: ${teksPopupSOS}<br>
                                              Latitude: ${lat}<br>
                                              Longitude: ${lng}<br>
                                              Baterai: ${infoBateraiLengkap}%<br>
                                              Update: ${waktuLokal}`;
                            
                            if (markers[idKey]) {
                                // JIKA ID_1 atau ID_2 SUDAH ADA: Geser posisinya masing-masing tanpa mengganggu ID lain
                                markers[idKey].setLatLng([lat, lng]);
                                markers[idKey].getPopup().setContent(isiPopup);
                                
                                // Jika marker sedang dalam kondisi terbuka saat data berubah, perbarui tampilannya langsung
                                if(markers[idKey].isPopupOpen()) {
                                    markers[idKey].refreshPopup();
                                }
                            } else {
                                // JIKA ID BARU MUNCUL: Gambar objek marker terpisah untuk masing-masing ID
                                markers[idKey] = L.marker([lat, lng]).addTo(map)
                                    .bindPopup(isiPopup);
                            }
                        }
                    });

                    // CETAK TEKS LOG BERSIH TEPAT DI BAWAH BARIS STATUS
                    document.getElementById("output-json").innerText = teksLogBersih.trim();

                    // 🌟 REAKSI VISUAL KOTAK LOG HITAM: Tambah/hapus class animasi kedip merah sesuai status global
                    const elemenLog = document.getElementById("output-json");
                    if (adaSinyalBahayaGlobal) {
                        elemenLog.classList.add("log-bahaya-aktif");
                    } else {
elemenLog.classList.remove("log-bahaya-aktif");}} else {document.getElementById("output-json").innerText = "Database Terhubung, tetapi kosong.";document.getElementById("output-json").classList.remove("log-bahaya-aktif");}} catch (e) {console.error("Gagal memperbarui peta dari Firebase:", e);document.getElementById("output-json").innerText = "Gagal memproses data. Periksa koneksi internet.";document.getElementById("output-json").classList.remove("log-bahaya-aktif");}}// Jalankan fungsi pembacaan data secara otomatis per 3 detik sekali secara real-timeupdateMarkerDariFirebase();setInterval(updateMarkerDariFirebase, 3000);// Trik memaksa layout peta ter-render utuh mengikuti lebar device sesaat setelah halaman terbuka sempurnasetTimeout(function() {map.invalidateSize();}, 500);// Otomatis menghitung ulang ukuran peta jika layar device diputar (di-rotate)window.addEventListener('resize', function() {map.invalidateSize();});
