<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realtime Monitoring GPS Pendaki</title>

    <!-- Bootstrap CSS Online -->
    <link href="https://bootstrapcdn.com" rel="stylesheet">
    
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com" />

    <style>
        #map {
            width: 100%;
            height: 400px; /* Tinggi peta disesuaikan agar rapi di bawah teks */
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin-top: 15px;
        }
        .well {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <h1 class="text-center">Realtime Monitoring GPS Using Firebase</h1>
            </div>
        </div>
        <hr>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="well">
                    Latitude : <span id="txt-lat">Menunggu Firebase...</span>
                    <hr>
                    Longitude : <span id="txt-lng">Menunggu Firebase...</span>
                    <hr>
                    Last Online (Database) : <span id="txt-online">-</span>
                    <hr>
                    Waktu Browser (Jam HP) : <span id="txt-jam">00:00:00</span>
                </div>
            </div>
        </div>

        <!-- Wadah Tempat Peta Ditampilkan -->
        <div class="row">
            <div class="col-md-12">
                <div id="map"></div>
            </div>
        </div>

        <hr>
        <div class="row">
            <div class="text-center col-md-6 col-md-offset-3">
                <h4>Monitoring Pendaki</h4>
                <p>Copyright © 2026 · All Rights Reserved</p>
            </div>
        </div>
        <hr>
    </div>

    <!-- Pustaka JavaScript Utama (Dipasang di bawah agar cepat dimuat) -->
    <script src="https://googleapis.com"></script>
    <script src="https://bootstrapcdn.com"></script>
    
    <!-- Pustaka Leaflet.js -->
    <script src="https://unpkg.com"></script>

    <!-- Pustaka Resmi Firebase SDK Versi Jadul (Kompatibel penuh tanpa modul/CORS) -->
    <script src="https://firebase.com"></script>

    <script>
        // 1. Elemen Penampung Teks
        var txtLat = document.getElementById('txt-lat'); 
        var txtLng = document.getElementById('txt-lng'); 
        var txtOnline = document.getElementById('txt-online');
        var txtJam = document.getElementById('txt-jam');

        // 2. Fungsi Jam Digital Sederhana (Sesuai metode Anda)
        var pad = function(x){
            return x < 10 ? '0' + x : x;
        }
        var showclock = function(){
            var e = new Date();
            var h = pad(e.getHours());
            var m = pad(e.getMinutes());
            var s = pad(e.getSeconds()); 
            txtJam.innerHTML = [h, m, s].join(':');
        }
        setInterval(showclock, 1000);

        // 3. Inisialisasi Peta Awal (Default pusat di Indonesia)
        var map = L.map('map').setView([-6.2088, 106.8456], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        
        var pendakiMarker = null;

        // 4. Koneksi Firebase Menggunakan Alamat Jalur Lama Anda
        // Langsung menembak spesifik ke folder: pendaki -> id_1
        var myRef = new Firebase('https://firebaseio.com');

        // Menggunakan event 'value' agar langsung membaca data saat web pertama dibuka, 
        // sekaligus otomatis memperbarui peta tiap kali koordinat berubah secara realtime.
        myRef.on('value', function(snapshot){
            var data = snapshot.val();
            
            if(data) {
                // Ambil data latitude dan longitude
                var lat = parseFloat(data.latitude);
                var lng = parseFloat(data.longitude);

                if(!isNaN(lat) && !isNaN(lng)) {
                    // Masukkan angka desimal ke tampilan teks Bootstrap
                    txtLat.innerHTML = lat;
                    txtLng.innerHTML = lng;

                    // Konversi unix timestamp dari database menjadi format jam tanggal lokal
                    if(data.last_online) {
                        var ts = parseInt(data.last_online);
                        txtOnline.innerHTML = !isNaN(ts) ? new Date(ts).toLocaleString('id-ID') : data.last_online;
                    }

                    // Render atau geser penanda (marker) di peta Leaflet
                    if (pendakiMarker === null) {
                        pendakiMarker = L.marker([lat, lng]).addTo(map);
                        pendakiMarker.bindPopup("<b>Pendaki ID_1</b><br>Lokasi Terdeteksi.").openPopup();
                    } else {
                        pendakiMarker.setLatLng([lat, lng]);
                    }
                    
                    // Kamera peta otomatis bergeser memfokuskan lokasi pendaki
                    map.setView([lat, lng], 15);
                } else {
                    txtLat.innerHTML = "Format data di database bukan angka!";
                }
            } else {
                txtLat.innerHTML = "Data path pendaki/id_1 kosong (null).";
            }
        }, function(errorObject) {
            txtLat.innerHTML = "Akses ditolak: " + errorObject.code + ". Silakan ubah Rules Firebase ke true.";
        });
    </script>
</body>
</html>
