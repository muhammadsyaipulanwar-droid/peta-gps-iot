<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba Memunculkan Peta</title>
    
    <!-- CSS Leaflet dari CDNJS Cloudflare -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <style>
        /* Memaksa halaman menggunakan ruang penuh layar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #cccccc; /* Warna abu-abu sebagai penanda jika peta gagal */
        }
        
        /* Wadah Peta Utama wajib berukuran penuh */
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- KONTEN HANYA PETA SAJA -->
    <div id="map"></div>

    <!-- JS Leaflet dari CDNJS Cloudflare -->
    <script src="https://cloudflare.com"></script>

    <script>
        // 1. Inisialisasi dasar peta (Fokus langsung ke Jakarta sebagai pengujian awal)
        // Jika koordinat ini berhasil, Leaflet dipastikan bekerja
        const map = L.map('map').setView([-6.2088, 106.8456], 13); 

        // 2. MENGGUNAKAN SERVER OPENSTREETMAP STANDAR (Paling aman & pasti muncul)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. Menambahkan satu penanda (Marker) tiruan untuk tes visual
        L.marker([-6.2088, 106.8456]).addTo(map)
            .bindPopup('<b>Peta Berhasil Muncul!</b><br>Jika Anda melihat pesan ini, Leaflet Anda normal.')
            .openPopup();
    </script>

</body>
</html>
